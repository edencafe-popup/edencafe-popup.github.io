<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>팝업 교환권 확인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* 운영진용: 위에 요약, 그 아래 이름 검색, 응답 목록(교환 완료 체크) */
:root{
  --bg:#f3eeea;--card:#f8f4f0;--ink:#5f5a54;--ink-soft:#8c857d;--olive:#8a9560;--olive-ink:#fff;--line:#d9d1c8;--warn:#c4453a;--done:#e7eadb;
  --serif:"Gowun Batang","Noto Serif KR",serif;--sans:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root{--bg:#22211d;--card:#2b2a25;--ink:#e6e0d8;--ink-soft:#aaa298;--olive:#a3ae78;--olive-ink:#1d1f15;--line:#45423b;--warn:#e7766b;--done:#343a26;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:16px}
h1{font-size:22px;margin:0;font-weight:700}
.sub{font-family:var(--sans);font-size:13px;color:var(--ink-soft)}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px}
input{width:100%;height:48px;border:1px solid var(--olive);border-radius:6px;background:transparent;color:var(--ink);font:inherit;padding:0 14px;font-size:16px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;border-radius:999px;border:0;background:var(--olive);color:var(--olive-ink);font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);width:auto;padding:0 16px;min-height:40px;font-weight:400;font-size:14px}
:focus-visible{outline:2px solid var(--olive);outline-offset:2px}
.err{color:var(--warn);font-family:var(--sans);font-size:13px;min-height:1.2em;margin:6px 0 0}
#appErr:empty{display:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-family:var(--sans);font-size:12px;color:var(--ink-soft)}
.bar{display:flex;gap:8px;align-items:center}
.bar input{flex:1;min-width:0}
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.row.done{background:var(--done)}
.row.no{opacity:.6}
.who{min-width:0}
.who b{font-size:17px;overflow-wrap:anywhere}
.meta{font-family:var(--sans);font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.toggle{min-width:92px;min-height:44px;border-radius:999px;border:1px solid var(--olive);background:transparent;color:var(--ink);font-family:var(--sans);font-size:14px;cursor:pointer}
.row.done .toggle{background:var(--olive);color:var(--olive-ink)}
.toggle:disabled{opacity:.5}
.empty{text-align:center;color:var(--ink-soft);font-size:14px;padding:24px 0}
.foot{font-family:var(--sans);font-size:12px;color:var(--ink-soft);text-align:center}
</style>
</head>
<body>
<main class="wrap">
  <div>
    <h1>팝업 교환권 확인</h1>
    <div class="sub">11월 9일 이든·북브런치 팝업 · 운영진 전용</div>
  </div>

  <section class="card" id="login">
    <form id="loginForm" novalidate>
      <label for="pin" style="display:block;margin-bottom:8px;font-weight:700">운영진 PIN</label>
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="6자리 숫자">
      <p class="err" id="loginErr" role="alert"></p>
      <button class="btn" type="submit">확인</button>
    </form>
  </section>

  <section id="app" hidden>
    <div class="wrap">
      <div class="card stats">
        <div class="stat"><b id="sAttend">0</b><span>참석 응답</span></div>
        <div class="stat"><b id="sPeople">0</b><span>오실 인원</span></div>
        <div class="stat"><b id="sDone">0</b><span>교환 완료</span></div>
      </div>
      <div class="bar">
        <input id="q" type="search" placeholder="성함 또는 교환권 번호로 찾기" autocomplete="off">
        <button class="btn ghost" type="button" id="refresh">새로고침</button>
      </div>
      <p class="err" id="appErr" role="alert"></p>
      <div class="list" id="list"></div>
      <p class="foot" id="updated"></p>
      <p class="foot"><button class="btn ghost" type="button" id="logout" style="margin:0 auto">PIN 다시 입력</button></p>
    </div>
  </section>
</main>

<script>
(function(){
  const SB_URL='https://qdkvclpapsasedrvhkvx.supabase.co', SB_KEY='sb_publishable_ceZ2sE7WKbkcod54qVl5aA_HR4bq4iQ';
  const $=id=>document.getElementById(id);
  let pin='', rows=[];
  const ss={get(){try{return sessionStorage.getItem('popup-pin')||''}catch(e){return ''}},set(v){try{sessionStorage.setItem('popup-pin',v)}catch(e){}},del(){try{sessionStorage.removeItem('popup-pin')}catch(e){}}};

  async function rpc(fn,body){
    const r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok){const t=await r.text();const e=new Error(t);e.status=r.status;e.unauth=/unauthorized/.test(t);throw e}
    return r.json();
  }
  async function load(){
    try{
      rows=await rpc('popup_admin_list',{p_key:pin});
      $('appErr').textContent='';
      render();
      $('updated').textContent='마지막 업데이트 '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
      return true;
    }catch(e){
      if(e.unauth)return false;
      $('appErr').textContent='목록을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.';
      return true;
    }
  }
  function render(){
    const q=$('q').value.trim().replace(/^no\.?\s*/i,'');
    const att=rows.filter(r=>r.attending);
    $('sAttend').textContent=att.length+'건';
    $('sPeople').textContent=att.reduce((s,r)=>s+(r.party_size||0),0)+'명';
    $('sDone').textContent=att.filter(r=>r.redeemed_at).length+'건';
    const shown=rows.filter(r=>!q||r.name.includes(q)||r.code===q)
      .sort((a,b)=>(b.attending-a.attending)||a.name.localeCompare(b.name,'ko'));
    const list=$('list'); list.textContent='';
    if(!shown.length){const p=document.createElement('p');p.className='empty';p.textContent=rows.length?'찾는 성함이 없습니다.':'아직 응답이 없습니다.';list.appendChild(p);return}
    for(const r of shown){
      const row=document.createElement('div');row.className='row'+(r.redeemed_at?' done':'')+(r.attending?'':' no');
      const who=document.createElement('div');who.className='who';
      const b=document.createElement('b');b.textContent=r.name;
      const m=document.createElement('div');m.className='meta';
      m.textContent=r.attending?`No. ${r.code} · ${r.party_size}명`+(r.redeemed_at?` · ${new Date(r.redeemed_at).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})} 교환`:''):'불참 응답';
      who.append(b,m);row.appendChild(who);
      if(r.attending){
        const t=document.createElement('button');t.type='button';t.className='toggle';
        t.textContent=r.redeemed_at?'교환 완료':'교환하기';
        t.setAttribute('aria-pressed',!!r.redeemed_at);
        t.onclick=async()=>{
          t.disabled=true;
          try{
            const v=await rpc('popup_admin_set_redeemed',{p_key:pin,p_id:r.id,p_redeemed:!r.redeemed_at});
            r.redeemed_at=v;render();
          }catch(e){$('appErr').textContent='저장하지 못했습니다. 다시 눌러 주세요.';t.disabled=false}
        };
        row.appendChild(t);
      }
      list.appendChild(row);
    }
  }
  async function enter(p){
    pin=p;
    const ok=await load();
    if(!ok){pin='';ss.del();return false}
    ss.set(p);$('login').hidden=true;$('app').hidden=false;return true;
  }
  $('loginForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const p=$('pin').value.trim();
    if(!p){$('loginErr').textContent='PIN을 입력해 주세요.';return}
    $('loginErr').textContent='';
    if(!await enter(p))$('loginErr').textContent='PIN이 맞지 않습니다.';
  });
  $('q').addEventListener('input',render);
  $('refresh').onclick=load;
  $('logout').onclick=()=>{ss.del();pin='';rows=[];$('app').hidden=true;$('login').hidden=false;$('pin').value=''};
  setInterval(()=>{if(pin&&!document.hidden)load()},15000);
  const saved=ss.get(); if(saved)enter(saved);
})();
</script>
</body>
</html>
