<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>이든 카페·이든 다이닝 팝업 초대장</title>
<meta name="description" content="2026년 11월 9일(월) 오후 6시 30분, 별드림관 헬스장 옆 TLC에서 열리는 이든 카페·이든 다이닝 팝업에 초대합니다.">
<meta property="og:title" content="이든 카페·이든 다이닝 팝업 초대장">
<meta property="og:description" content="11월 9일(월) 오후 6:30 · 별드림관 헬스장 옆 TLC · 참석 신청하시면 치아바타 교환권을 드려요">
<meta property="og:image" content="https://edencafe-popup.github.io/assets/coupon.png">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@500;700&display=swap">
<style>
/* 이든 카페·이든 다이닝 팝업 초대장 — 공통 스타일
   레이아웃: 휴대폰 한 화면 크기 카드를 세로로 쌓고, 아래로 스크롤 */
:root{
  --bg:#f3eeea;
  --card:#f8f4f0;
  --ink:#3b3632;
  --ink-soft:#57514b;
  --line:#d9d1c8;
  --line-strong:#c9c0b5;
  --accent:#5c6639;
  --accent-ink:#ffffff;
  --warn:#a83a2f;
  --serif:"Gowun Batang","Noto Serif KR",serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:500;font-size:18px;line-height:1.6;word-break:keep-all;
  padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}
img{max-width:100%}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

.top{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink-soft)}
.pill{border:1px solid var(--line-strong);border-radius:999px;padding:3px 12px;font-variant-numeric:tabular-nums}

.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:6px;
  box-shadow:inset 0 0 0 9px var(--card),inset 0 0 0 10px var(--line);
  min-height:calc(100vh - 32px);min-height:calc(100svh - 32px);
  padding:44px 30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;
  scroll-margin-top:16px}
.card.first{min-height:calc(100vh - 76px);min-height:calc(100svh - 76px)}
.card::after{content:"";position:absolute;inset:14px;pointer-events:none;border:1px solid var(--accent);opacity:.5;
  -webkit-mask:linear-gradient(#000 0 0) top left/22px 22px no-repeat,linear-gradient(#000 0 0) top right/22px 22px no-repeat,linear-gradient(#000 0 0) bottom left/22px 22px no-repeat,linear-gradient(#000 0 0) bottom right/22px 22px no-repeat;
  mask:linear-gradient(#000 0 0) top left/22px 22px no-repeat,linear-gradient(#000 0 0) top right/22px 22px no-repeat,linear-gradient(#000 0 0) bottom left/22px 22px no-repeat,linear-gradient(#000 0 0) bottom right/22px 22px no-repeat}
.card.has-cue{padding-bottom:124px}

h1,h2{font-family:var(--serif);font-weight:700;margin:0;text-wrap:balance}
h1{font-size:36px;letter-spacing:.02em}
h2{font-size:30px;line-height:1.4}
p{margin:0}

.brand{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--accent);font-weight:700;letter-spacing:.1em;line-height:1.35}
.brand .b1{font-size:18px}
.brand .b2{font-size:14px;font-weight:500;letter-spacing:.04em;color:var(--ink-soft)}
.brand .b3{font-size:16px}
.rule{width:48px;height:2px;background:var(--line-strong)}
.when{display:flex;flex-direction:column;gap:4px;line-height:1.5;font-size:19px}
.when .date{font-size:21px;font-weight:700}

.cue{position:absolute;left:0;right:0;bottom:34px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:16px;color:var(--ink-soft);text-decoration:none;padding:6px 0}
.cue .arr{color:var(--accent);font-size:22px;font-weight:700;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}

.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:60px;border-radius:999px;border:0;
  background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;font-size:20px;text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--accent);min-height:58px;font-size:19px}
.btn:disabled{opacity:.6;cursor:wait}
.btn:active{transform:scale(.985)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#e9ecdc;border:1px solid #c7cdb0;border-radius:8px;
  padding:12px 14px;font-size:16px;color:var(--ink)}
.banner a{color:var(--accent);font-weight:700;white-space:nowrap}

@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}.cue .arr{animation:none}}
@media (max-height:700px){.card{padding-top:34px;padding-bottom:34px;gap:16px}.card.has-cue{padding-bottom:116px}h1{font-size:32px}h2{font-size:27px}}
</style>
<style>
.field{width:100%;display:flex;flex-direction:column;gap:8px;text-align:left}
.field label{font-size:19px;font-weight:700}
.field input{height:58px;border:2px solid var(--accent);border-radius:8px;background:#fff;padding:0 16px;font:inherit;font-size:20px;color:var(--ink)}
.field input::placeholder{color:#6b655e}
form{width:100%;display:flex;flex-direction:column;gap:20px}
.err{color:var(--warn);font-size:16px;font-weight:700;text-align:left}
.err:empty{display:none}
.card.photos{padding:36px 26px;gap:14px}
.photos figure{position:relative;margin:0;width:100%;aspect-ratio:16/10;border-radius:6px;overflow:hidden;flex:none}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos figcaption{position:absolute;top:14px;left:16px;color:#fff;font-family:var(--serif);font-size:26px;font-weight:700;line-height:1.3;
  text-shadow:0 1px 2px rgba(0,0,0,.75),0 0 10px rgba(0,0,0,.6),0 0 22px rgba(0,0,0,.45)}
</style>
</head>
<body>
<main class="wrap">
  <div class="top"><span class="pill" id="dday">11월 9일</span></div>

  <div class="banner" id="done" hidden>
    <span>이미 참석 신청을 하셨어요.</span>
    <a href="coupon.html">내 쿠폰 보기 →</a>
  </div>

  <section class="card first has-cue" id="invite" aria-label="초대">
    <div class="brand">
      <span class="b1">EDEN</span>
      <span class="b2">and</span>
      <span class="b3">EDEN DINING &amp; BOOKSTORE</span>
    </div>
    <h1>팝업 초대장</h1>
    <div class="rule"></div>
    <div class="when">
      <span class="date">2026년 11월 9일 (월)</span>
      <span>오후 6시 30분 ~ 8시 30분</span>
      <span>별드림관 헬스장 옆 TLC</span>
    </div>
    <a class="cue" href="#rsvp">아래로 내려 참석 신청하기<span class="arr" aria-hidden="true">↓</span></a>
  </section>

  <section class="card photos" id="places" aria-label="팝업에서 만나는 곳">
    <figure>
      <img src="assets/eden.jpg" alt="진열대에 놓인 여러 가지 빵" width="1200" height="750" loading="lazy">
      <figcaption>이든 카페</figcaption>
    </figure>
    <figure>
      <img src="assets/brunch.jpg" alt="샐러드와 구운 고기, 음료가 차려진 브런치 식탁" width="1200" height="750" loading="lazy">
      <figcaption>이든 다이닝</figcaption>
    </figure>
    <figure>
      <img src="assets/bookstore.jpg" alt="나무 책장에 진열된 책들" width="1200" height="750" loading="lazy">
      <figcaption>서점</figcaption>
    </figure>
  </section>

  <section class="card" id="rsvp" aria-label="참석 신청">
    <h2>참석 신청</h2>
    <p>제출하시면 팝업 참여 시 사용 가능한<br>치아바타 교환권을 드립니다!</p>
    <form id="rsvpForm" novalidate>
      <div class="field">
        <label for="name">성함</label>
        <input id="name" name="name" type="text" autocomplete="name" maxlength="40" placeholder="성함을 적어 주세요">
      </div>
      <p class="err" id="err" role="alert"></p>
      <button class="btn" type="submit" id="submitBtn">제출</button>
    </form>
  </section>
</main>

<script>
(function(){
  var SB_URL='https://qdkvclpapsasedrvhkvx.supabase.co', SB_KEY='sb_publishable_ceZ2sE7WKbkcod54qVl5aA_HR4bq4iQ';
  var KEY='popup-rsvp-v2';
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||sessionStorage.getItem(KEY))}catch(e){return null}}
  function save(v){var s=JSON.stringify(v);try{localStorage.setItem(KEY,s)}catch(e){}try{sessionStorage.setItem(KEY,s)}catch(e){}}

  // D-day
  var today=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Seoul'}), d=Math.round((Date.UTC(2026,10,9)-Date.parse(today+'T00:00:00Z'))/864e5);
  document.getElementById('dday').textContent=d>0?('D-'+d+' · 11월 9일'):(d===0?'오늘 팝업이 열려요':'11월 9일 팝업');

  var saved=load();
  if(saved&&saved.name)document.getElementById('done').hidden=false;

  var form=document.getElementById('rsvpForm'), nameEl=document.getElementById('name'),
      err=document.getElementById('err'), btn=document.getElementById('submitBtn');
  form.addEventListener('submit',function(e){
    e.preventDefault();
    var name=nameEl.value.trim();
    if(!name){err.textContent='성함을 적어 주세요.';nameEl.focus();return}
    err.textContent='';btn.disabled=true;btn.textContent='보내는 중…';
    fetch(SB_URL+'/rest/v1/rpc/popup_submit_rsvp',{method:'POST',
      headers:{'apikey':SB_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({p_name:name,p_attending:true,p_party:null})})
    .then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json()})
    .then(function(code){
      save({name:name,code:String(code),at:Date.now()});
      nameEl.blur();
      location.href='coupon.html';
    })
    .catch(function(){
      err.textContent='보내지 못했습니다. 인터넷 연결을 확인하고 다시 눌러 주세요.';
      btn.disabled=false;btn.textContent='제출';
    });
  });
})();
</script>
</body>
</html>
