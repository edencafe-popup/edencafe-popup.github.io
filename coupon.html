<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>치아바타 교환권 · 이든·북브런치 팝업</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@500;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
<style>
.coupon-img{width:300px;height:auto;display:block;filter:drop-shadow(0 8px 14px rgba(60,50,30,.18))}
.owner{width:100%;border-top:1.5px dashed var(--line-strong);padding-top:14px;font-size:24px;font-weight:700}
.place-photo{width:100%;height:auto;aspect-ratio:16/10;object-fit:cover;border-radius:6px;display:block}
.place{display:flex;flex-direction:column;gap:6px;line-height:1.5}
.place strong{font-size:22px}
.place span{font-size:19px}
.dl-msg{font-size:15px;color:var(--ink-soft);margin-top:-10px}
.dl-msg:empty{display:none}
/* 휴대폰 저장 화면 */
.saveview{position:fixed;inset:0;z-index:50;background:rgba(20,18,14,.75);display:flex;align-items:center;justify-content:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.savebox{width:100%;max-width:400px;max-height:100%;overflow:auto;background:var(--card);border-radius:10px;padding:20px;display:grid;gap:14px;text-align:center}
.savebox .t{font-family:var(--serif);font-size:22px;font-weight:700;margin:0}
.savebox img{width:100%;height:auto;border:1px solid var(--line);border-radius:6px;-webkit-touch-callout:default;user-select:auto}
.savebox .help{font-size:17px;line-height:1.6}
</style>
</head>
<body>
<main class="wrap">
  <div class="top"><span class="pill" id="dday">11월 9일</span></div>

  <section class="card first has-cue" id="coupon" aria-label="치아바타 교환권">
    <h2>팝업에서 뵙겠습니다!</h2>
    <img class="coupon-img" src="assets/coupon.png" alt="FREE CIABATTA 쿠폰" width="640" height="327">
    <p style="font-size:19px">팝업에 참여하시고<br>이 쿠폰을 보여주시면<br><strong>치아바타로 교환해 드립니다.</strong></p>
    <p class="owner" id="owner">○○○ 님</p>
    <button class="btn ghost" type="button" id="dl">쿠폰 이미지 저장</button>
    <p class="dl-msg" id="dlMsg" role="status"></p>
    <a class="cue" href="#location">아래로 내려 오시는 길 보기<span class="arr" aria-hidden="true">↓</span></a>
  </section>

  <section class="card" id="location" aria-label="오시는 길">
    <h2>오시는 길</h2>
    <img class="place-photo" src="assets/building.jpg" alt="TLC가 있는 건물 1층 — 통유리창이 이어진 흰 건물" width="1200" height="675">
    <div class="place">
      <strong>별드림관 헬스장 옆 TLC</strong>
      <span>11월 9일 (월)</span>
      <span>오후 6시 30분 ~ 8시 30분</span>
    </div>
  </section>

  <section class="card" id="thanks" aria-label="감사 인사">
    <h2>참여해주셔서<br>감사합니다</h2>
    <div class="rule"></div>
    <div class="brand">
      <span class="b1">EDEN</span>
      <span class="b2">and</span>
      <span class="b3">BOOK BRUNCH &amp; BOOKSTORE</span>
    </div>
  </section>
</main>

<div class="saveview" id="saveView" role="dialog" aria-modal="true" aria-labelledby="saveTitle" hidden>
  <div class="savebox">
    <p class="t" id="saveTitle">쿠폰 이미지</p>
    <img id="saveImg" alt="치아바타 교환권 이미지">
    <p class="help"><b>이미지를 손가락으로 길게 누른 뒤</b><br>&lsquo;사진 앱에 저장&rsquo; 또는 &lsquo;이미지 다운로드&rsquo;를<br>누르면 사진첩에 저장됩니다.</p>
    <button class="btn" type="button" id="saveShare" hidden>공유 메뉴에서 저장하기</button>
    <button class="btn ghost" type="button" id="saveClose">닫기</button>
  </div>
</div>

<script>
(function(){
  var KEY='popup-rsvp-v2';
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||sessionStorage.getItem(KEY))}catch(e){return null}}
  var saved=load();
  if(!saved||!saved.name){location.replace('./#rsvp');return}
  document.getElementById('owner').textContent=saved.name+' 님';

  var today=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Seoul'}), d=Math.round((Date.UTC(2026,10,9)-Date.parse(today+'T00:00:00Z'))/864e5);
  document.getElementById('dday').textContent=d>0?('D-'+d+' · 11월 9일'):(d===0?'오늘 팝업이 열려요':'11월 9일 팝업');

  // 쿠폰 이미지 만들기
  function couponPng(){
    return new Promise(function(res,rej){
      var img=document.querySelector('.coupon-img');
      function draw(){
        var W=900,H=900,c=document.createElement('canvas');c.width=W;c.height=H;var x=c.getContext('2d');
        x.fillStyle='#f8f4f0';x.fillRect(0,0,W,H);
        x.strokeStyle='#d9d1c8';x.lineWidth=3;x.strokeRect(24,24,W-48,H-48);
        var iw=740,ih=Math.round(iw*img.naturalHeight/img.naturalWidth);
        x.drawImage(img,(W-iw)/2,110,iw,ih);
        x.textAlign='center';x.fillStyle='#3b3632';
        x.font='700 46px "Noto Sans KR", sans-serif';
        x.fillText(saved.name+' 님',W/2,110+ih+110);
        x.fillStyle='#57514b';x.font='500 32px "Noto Sans KR", sans-serif';
        x.fillText('11월 9일 이든·북브런치 팝업',W/2,110+ih+175);
        x.fillText('현장에서 보여주시면 치아바타로 교환해 드립니다',W/2,110+ih+225);
        c.toBlob(function(b){b?res(b):rej(new Error('blob'))},'image/png');
      }
      if(img.complete&&img.naturalWidth)draw();else{img.onload=draw;img.onerror=rej}
    });
  }
  var isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Macintosh/.test(navigator.userAgent));
  var dl=document.getElementById('dl'),dlMsg=document.getElementById('dlMsg'),
      sv=document.getElementById('saveView'),svImg=document.getElementById('saveImg'),svShare=document.getElementById('saveShare');
  var file=null;
  function toDataURL(b){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=rej;r.readAsDataURL(b)})}
  dl.addEventListener('click',function(){
    dlMsg.textContent='';
    (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(couponPng).then(function(blob){
      var fname='popup-coupon.png';
      if(isMobile){
        try{file=new File([blob],fname,{type:'image/png'})}catch(e){file=null}
        return toDataURL(blob).then(function(u){
          svImg.src=u;
          var ok=false;try{ok=!!(file&&navigator.canShare&&navigator.canShare({files:[file]}))}catch(e){}
          svShare.hidden=!ok;sv.hidden=false;document.body.style.overflow='hidden';
        });
      }
      var url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=fname;
      document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},4000);
    }).catch(function(){dlMsg.textContent='이미지를 만들지 못했습니다. 이 화면을 캡처해 주세요.'});
  });
  svShare.addEventListener('click',function(){if(file)navigator.share({files:[file]}).catch(function(){})});
  function closeSave(){sv.hidden=true;document.body.style.overflow=''}
  document.getElementById('saveClose').addEventListener('click',closeSave);
  sv.addEventListener('click',function(e){if(e.target===sv)closeSave()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!sv.hidden)closeSave()});
})();
</script>
</body>
</html>
